server:
  port: ${SERVER_PORT_AUTH_SERVICE:8084}

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  jwt:
    # Default só para local; em prod use JWT_SECRET forte via env
    secret: ${JWT_SECRET:bankflow-local-dev-secret-key-32b!}
    expiration-ms: 900000

  account-service:
    base-url: ${ACCOUNT_SERVICE_URI:http://localhost:8081}

  rate-limit:
    enabled: true
    capacity: 10
    refill-duration: 1m
    paths:
      - /auth/login
      - /auth/register
